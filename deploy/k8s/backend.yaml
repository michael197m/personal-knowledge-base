apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: personal-knowledge-base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: personal-knowledge-base-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pkb-config
            - secretRef:
                name: pkb-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: personal-knowledge-base
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
