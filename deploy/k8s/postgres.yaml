apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: personal-knowledge-base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: pkb-config
            - secretRef:
                name: pkb-secrets
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-sql
          configMap:
            name: pkb-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: personal-knowledge-base
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
